[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "golive-mcp"
version = "0.1.0"
description = "GoLive Active Call operations through the existing Mac runner"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2"]

[project.scripts]
golive-mcp = "golive_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/golive_mcp"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "build>=1,<2", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
