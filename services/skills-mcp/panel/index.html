<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xiaocui · Skills &amp; tools</title><link rel="stylesheet" href="/panel.css"><script defer src="/panel.js"></script></head>
<body><main>
<header><span>Xiaocui</span><h1>Skills &amp; tools</h1></header>
<form id="login"><label>Administrator token<input id="token" type="password" required autocomplete="off"></label><button>Open catalog</button></form>
<div id="editor" hidden>
<section><h2>Quotation tool</h2><p><code>quote_total</code> calls the GoLive CRM calculator.</p><label><input id="toolOn" type="checkbox"> Enable tool and dependent skills</label><label>Tool description<textarea id="toolDesc" rows="2"></textarea></label><label>CRM timeout in seconds<input id="timeout" type="number" min="5" max="180"></label></section>
<section><h2>Outbound skills</h2><div class="row"><select id="choose" aria-label="Select skill"></select><button id="add">Add skill</button><button id="remove">Remove from draft</button></div>
<div id="fields"><label><input id="skillOn" type="checkbox"> Enable this skill</label><label>Skill name<input id="skillName" maxlength="64"></label><label>When to use it<input id="skillDesc" maxlength="1024"></label><label>Required tool<select id="binding"><option value="">Guidance only</option><option>quote_total</option></select></label><label>Trigger events (comma-separated)<input id="events" placeholder="wechat.add_requested, wechat.notification_help"></label><label>Required state (JSON field → allowed values)<textarea id="guards" rows="2" spellcheck="false"></textarea></label><label>Instructions in Markdown<textarea id="body" rows="14" spellcheck="false"></textarea></label></div></section>
<footer><button id="save">Publish changes</button><button id="reload">Reload published catalog</button><span id="revision"></span></footer>
<section><h2>Preview a published turn</h2><label>Original prompt component<textarea id="original" rows="2">你是小翠。跟随客户的反馈，每次只说当前需要的一步。</textarea></label>
<label>Business event<input id="event" value="wechat.notification_help"></label><label>Session state (JSON)<input id="state" value='{"wechat.status":"consented"}'></label><button id="preview">Preview turn</button><pre id="output" aria-live="polite"></pre></section></div>
<p id="status" role="status"></p></main></body></html>
